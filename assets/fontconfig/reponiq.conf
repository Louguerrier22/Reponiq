<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Keep system/user fonts and aliases, but never reuse another Fontconfig
       build's writable cache from the host or an older AppImage. -->
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <dir>~/.fonts</dir>
  <include ignore_missing="yes">/etc/fonts/conf.d</include>
  <cachedir prefix="xdg">reponiq/fontconfig-v1</cachedir>
  <config><rescan><int>30</int></rescan></config>
</fontconfig>
